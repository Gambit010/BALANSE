appId: com.balanseapp.app
---

# Boundary type: Auth to app
# What to test: Google signup navigates to correct screen (onboarding screen)

- launchApp:
    clearState: true

# Open signup from the landing screen.
- assertVisible: "BALANSE"
- assertVisible: "Smart Task Management for Student Leaders"
- assertVisible: "Get Started"
- tapOn: "Get Started"
- assertVisible: "Create Account"

- scrollUntilVisible:
    element:
      text: "Continue with Google"
    direction: DOWN
    timeout: 10000

- tapOn: "Continue with Google"

- assertVisible: "Choose an account"
- assertVisible: "Kyle Aundry Delos Santos (Kyle aundry)"
- tapOn: "Kyle Aundry Delos Santos (Kyle aundry)"

- extendedWaitUntil:
    visible: "Account Created"
    timeout: 50000

- tapOn: "OK"

- assertVisible: "BALANSE"
- assertVisible: "Smart Task Management"
- assertVisible: "Skip"
- assertVisible: "Next"

- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Get Started"