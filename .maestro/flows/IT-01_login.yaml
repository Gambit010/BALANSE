appId: com.balanseapp.app
---

# Integration Testing 01: Authentication Flow
# Tests: A valid email/password login opens the authenticated onboarding screen.

- launchApp:
    clearState: true

# Verify the unauthenticated landing screen.
- assertVisible: "BALANSE"
- assertVisible: "Smart Task Management for Student Leaders"
- assertVisible: "Get Started"
- assertVisible: "Log In"

# Open the login screen.
- tapOn: "Log In"
- assertVisible: "Welcome back!"
- assertVisible: "Log In"
- assertVisible: "Forgot Password?"

# Enter valid credentials. The selectors use the exact placeholders in LoginScreen.js.
- tapOn:
    text: "Enter your email"
- inputText: "kobe@gmail.com"

- tapOn:
    text: "Enter your password"
- inputText: "kyleaundry03"

# Submit the form.
- tapOn: "Log In"

# App.js displays Onboarding for an authenticated account whose onboarding flag
# has not been stored yet. Wait for Firebase auth/navigation to finish.
- extendedWaitUntil:
    visible: "Skip"
    timeout: 50000

- assertVisible: "BALANSE"
- assertVisible: "Smart Task Management"
- assertVisible: "Skip"
- assertVisible: "Next"

- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Get Started"
